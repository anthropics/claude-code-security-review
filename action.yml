name: 'Claude Code Security Review (Bedrock)'
description: 'Security review using Claude via AWS Bedrock'

inputs:
  bedrock-api-key:
    description: 'Bedrock API Key (starts with bedrock-api-key-)'
    required: true

  aws-region:
    description: 'AWS Region for Bedrock (e.g., us-east-1)'
    required: false
    default: 'us-east-1'

  bedrock-model-id:
    description: 'Bedrock Model ID'
    required: false
    default: 'anthropic.claude-3-5-sonnet-20241022-v2:0'

  comment-pr:
    description: 'Leave comments on PR for each finding'
    required: false
    default: 'true'

  upload-results:
    description: 'Upload results as workflow artifact'
    required: false
    default: 'true'

  exclude-directories:
    description: 'Comma-separated directories to exclude from scan'
    required: false

  custom-security-scan-instructions:
    description: 'Custom security instructions'
    required: false

outputs:
  findings-count:
    description: 'Total number of security findings'
    value: ${{ steps.security-review.outputs.findings-count }}

  results-file:
    description: 'Path to JSON results file'
    value: ${{ steps.security-review.outputs.results-file }}

runs:
  using: 'composite'
  steps:
    - name: 'Run Security Review with Bedrock API Key'
      id: security-review
      run: |
        python -m claudecode.github_action_audit
      shell: bash
      env:
        # GitHub Context
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}

        # Bedrock Configuration
        BEDROCK_API_KEY: ${{ inputs.bedrock-api-key }}
        AWS_REGION: ${{ inputs.aws-region }}
        BEDROCK_MODEL_ID: ${{ inputs.bedrock-model-id }}
        USE_BEDROCK: 'true'

        # Security Review Options
        COMMENT_PR: ${{ inputs.comment-pr }}
        UPLOAD_RESULTS: ${{ inputs.upload-results }}
        EXCLUDE_DIRECTORIES: ${{ inputs.exclude-directories }}
        CUSTOM_SECURITY_SCAN_INSTRUCTIONS: ${{ inputs.custom-security-scan-instructions }}