name: SAST

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to commit hash

      - uses: ./ # Points directly to action.yml
        with:
          comment-pr: true
          upload-results: true
          exclude-directories: "tests/vulnerable"
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          run-every-commit: true
