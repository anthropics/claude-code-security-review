name: Test ClaudeCode Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  test-claudecode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 pinned to commit hash

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 pinned to commit hash
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 pinned to commit hash
        with:
          node-version: "20"

      - name: Install Claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r claudecode/requirements.txt

      - name: Run ClaudeCode unit tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest claudecode -v --cov=claudecode --cov-report=term-missing

      - name: Install Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0 pinned to commit hash
        with:
          bun-version: latest

      - name: Install script dependencies
        run: |
          cd scripts
          bun install

      - name: Run comment script tests
        run: |
          cd scripts
          bun test
